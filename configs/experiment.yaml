seed: 42

labels: [explicit_crisis, implicit_crisis, hard_negative, non_crisis]

split:
  test_size: 0.20
  val_size: 0.15          # fraction of the train/val portion
  stratify_on: label

tfidf:
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  min_df: 2
  max_features: 100000
  sublinear_tf: true
  logistic_regression:
    C: 1.0
    max_iter: 2000
    class_weight: balanced

bert:
  model_name: bert-base-uncased
  max_length: 256
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 4
  weight_decay: 0.01
  warmup_ratio: 0.1
  early_stopping_patience: 2

evaluation:
  slices: [explicit_crisis, implicit_crisis, hard_negative]
  metrics: [accuracy, precision, recall, f1]
  average: macro
